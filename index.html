<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director Loan Interest</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--maroon:#8B1A1A;--maroon-d:#6e1414;--char:#343532;--grey:#5a5a5a;--line:#e3dfda;--bg:#f7f5f2;--card:#fff;--ok:#2e6b3a;--warn:#9a5b00;--warnbg:#fff4de;--bad:#a11;--badbg:#fde9e9}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--char)}
header{background:var(--maroon);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.2px}
header span{opacity:.8;font-size:12.5px}
nav{display:flex;gap:2px;background:var(--char);padding:0 14px;overflow-x:auto}
nav button{background:none;border:0;color:#d9d6d1;padding:11px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--grey);font-size:12.5px}
.drop{border:2px dashed #c9c3bb;border-radius:8px;padding:26px;text-align:center;background:#fcfbfa;cursor:pointer}
.drop.over{border-color:var(--maroon);background:#faf1f1}
.drop b{color:var(--maroon)}
button.btn,label.btn{background:var(--maroon);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.btn:hover,label.btn:hover{background:var(--maroon-d)}
button.btn.sec,label.btn.sec{background:#fff;color:var(--maroon);border:1px solid var(--maroon)}
button.btn[disabled]{opacity:.45;cursor:not-allowed}
button.lnk{background:none;border:0;color:var(--maroon);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
input,select{font:inherit;padding:6px 8px;border:1px solid #cfc9c1;border-radius:5px;background:#fff;color:var(--char)}
input[type=number]{width:96px}
input.w-s{width:96px}input.w-m{width:170px}input.w-l{width:100%}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--grey);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f0ece7;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:#e6f3e8;color:var(--ok)}.pill.todo{background:#f6e7e7;color:var(--maroon)}
.note{border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13px}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}.note.info{background:#eef2f6;color:#33475b}
details{margin-top:8px}summary{cursor:pointer;color:var(--maroon);font-weight:600;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;margin:10px 0}
.kv div span{display:block;font-size:11.5px;color:var(--grey)}
.kv div b{font-weight:600}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.sm td,.sm th{padding:4px 8px;font-size:12.5px}
.hidden{display:none}
textarea{width:100%;height:120px;font:12px ui-monospace,monospace}
.stmt-prev{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.x{color:var(--bad);cursor:pointer;background:none;border:0;font-size:16px;line-height:1}
@media(max-width:640px){main{padding:12px 8px}.card{padding:12px}}

.login{max-width:380px;margin:70px auto}
.login input{width:100%;margin:4px 0 10px}
header .sp{flex:1}
header select{background:#fff;color:var(--char);border:0;font-weight:600;max-width:290px}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
header button:hover{background:rgba(255,255,255,.28)}
input:disabled,select:disabled{background:#f3f1ee;color:#777}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav"></nav>
<main id="app"></main>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/stmt.js"></script>
<script src="js/app.js"></script>
</body>
</html>
